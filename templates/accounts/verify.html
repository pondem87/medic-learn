{% extends 'accounts/form.html' %}
{% block form_intro %}
    <h2 class="h4 mb-3">Check your inbox</h2>
    <p class="mb-4">Enter the five-digit code sent to your email address. Your code expires after ten minutes.</p>
{% endblock %}
{% block submit_label %}Verify email{% endblock %}
{% block form_footer %}
    <form method="post" action="{% url 'resend' %}" class="mt-4">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-primary w-100 py-3">Send a new code</button>
    </form>
{% endblock %}
