<section class="account-panel bg-light p-4 h-100" aria-labelledby="account-{{ account.pk }}">
    <h2 class="h4 text-break" id="account-{{ account.pk }}">{{ account.profile.name|default:account.email }}</h2>
    <p class="text-break">{{ account.email }}</p>
    <div class="d-flex flex-wrap gap-2 mb-3">
        <span class="badge bg-dark">{{ account.state|title }}</span>
        <span class="badge profile-status">{{ account.profile.role|title }}</span>
        <span class="badge profile-status">{{ account.profile.validation|title }}</span>
    </div>
    {% if account.profile.biography %}<p class="text-break">{{ account.profile.biography }}</p>{% endif %}
    <form method="post" class="account-form">
        {% csrf_token %}
        <input type="hidden" name="user_id" value="{{ account.pk }}">
        <div class="form-field mb-3">
            <label for="action-{{ account.pk }}">Action</label>
            <select name="action" id="action-{{ account.pk }}">
                <option value="review">Start review</option>
                <option value="validate">Validate</option>
                <option value="return">Return for changes</option>
                <option value="role">Assign role</option>
                <option value="suspended">Suspend</option>
                <option value="disabled">Disable</option>
                <option value="restore">Restore</option>
                <option value="deleted">Delete account</option>
                <option value="approve_verification">Approve verification issuance</option>
                <option value="deny_verification">Deny verification issuance</option>
            </select>
        </div>
        <div class="form-field mb-3">
            <label for="role-{{ account.pk }}">Role</label>
            <select name="role" id="role-{{ account.pk }}">
                <option value="learner">Learner</option>
                <option value="trainer">Trainer</option>
                <option value="staff">Staff</option>
            </select>
        </div>
        <div class="form-field mb-4">
            <label for="reason-{{ account.pk }}">Reason</label>
            <textarea name="reason" id="reason-{{ account.pk }}" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary py-3 px-4">Apply</button>
    </form>
</section>
